[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpguard"
version = "0.2.0"
description = "明棱 MCPGuard：本地 AI Agent 安全扫描器，检测 MCP 工具描述中的投毒特征"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ChenLaoshiYF" }]
keywords = ["mcp", "security", "prompt-injection", "tool-poisoning", "llm-security", "ai-agent"]

dependencies = []

[project.optional-dependencies]
# MCP server 模式（可选，不装不影响 CLI 的零依赖属性）
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mcpguard = "mcpguard.cli:main"
mcpguard-server = "mcpguard.server_mcp:main"

[tool.setuptools.packages.find]
include = ["mcpguard*"]
