[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpguard"
version = "0.1.0"
description = "鉴盾 MCPGuard：本地 AI Agent 安全扫描器，检测 MCP 工具描述中的投毒特征"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ChenLaoshiYF" }]
keywords = ["mcp", "security", "prompt-injection", "tool-poisoning", "llm-security", "ai-agent"]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mcpguard = "mcpguard.cli:main"

[tool.setuptools.packages.find]
include = ["mcpguard*"]
